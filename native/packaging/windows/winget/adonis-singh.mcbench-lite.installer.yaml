# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.28.0.schema.json
# Template: winget.sh fills in @VERSION@ and @SHA256_X64@ from the release folder.
# The installer is native/packaging/windows/installer.nsi: per-user, no administrator,
# silent with /S (nullsoft's default switch); /SOURCE=winget makes the app's
# install-source "winget", so its own updater stands down.
PackageIdentifier: adonis-singh.mcbench-lite
PackageVersion: @VERSION@
InstallerType: nullsoft
Scope: user
InstallModes:
- interactive
- silent
InstallerSwitches:
  Custom: /SOURCE=winget
UpgradeBehavior: install
Installers:
- Architecture: x64
  InstallerUrl: https://github.com/adonis-singh/mcbench-lite/releases/download/v@VERSION@/mcbench-lite-setup-x64.exe
  InstallerSha256: @SHA256_X64@
ManifestType: installer
ManifestVersion: 1.28.0
