# cargo-about's configuration for the renderer's third-party notices
# (scripts/draw-notices.js): the licences the crates mcbench-draw links may
# carry. A crate under any other licence fails the notices, so a new
# licence is looked at before it ships.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "IJG",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
